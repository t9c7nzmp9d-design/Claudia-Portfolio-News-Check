name: News sammeln

# Sammelt alle 30 Minuten die Schlagzeilen der Quellen aus news/feeds.json (keine nutzerbezogenen Daten)
# und legt sie als news.json im Branch „news-data“ ab. Die App lädt diese Datei über
# raw.githubusercontent.com und ordnet die Artikel lokal den Depot-Positionen zu.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['news/**', 'scripts/collect-news.mjs', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency:
  group: news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Vorherige Sammlung laden
        run: |
          git fetch --depth=1 origin news-data && git show FETCH_HEAD:news.json > /tmp/prev.json || echo "Noch keine vorherige Sammlung"

      - name: News sammeln
        run: |
          mkdir -p /tmp/out
          node scripts/collect-news.mjs /tmp/out/news.json /tmp/prev.json

      - name: DivvyDiary-Probe (temporär)
        if: github.event_name == 'workflow_dispatch'
        run: >
          node scripts/probe-cors.mjs
          "https://api.divvydiary.com/symbols/DE0008404005"
          "https://api.divvydiary.com/symbols/DE0008404005/dividends"
          "https://api.divvydiary.com/symbols/IE00B3RBWM25"
          "https://api.divvydiary.com/symbols/US9311421039"
          "https://api.divvydiary.com/dividends?isin=DE0008404005"
          "https://divvydiary.com/de/allianz-aktie-DE0008404005"

      - name: In Branch news-data veröffentlichen
        # Läuft auf dem Standard-Branch des Repos (geplante Läufe) – egal, wie dieser heißt
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/out
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "News aktualisiert $(date -u +%Y-%m-%dT%H:%MZ)"
          # Der Daten-Branch enthält immer nur einen Commit (kein wachsender Verlauf).
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" news-data
