name: News sammeln

# Sammelt alle 30 Minuten die Schlagzeilen der Quellen aus news/feeds.json (keine nutzerbezogenen Daten)
# und legt sie als news.json im Branch „news-data“ ab. Die App lädt diese Datei über
# raw.githubusercontent.com und ordnet die Artikel lokal den Depot-Positionen zu.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['news/**', 'scripts/collect-news.mjs', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency:
  group: news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Vorherige Sammlung laden
        run: |
          git fetch --depth=1 origin news-data && git show FETCH_HEAD:news.json > /tmp/prev.json || echo "Noch keine vorherige Sammlung"

      - name: News sammeln
        run: |
          mkdir -p /tmp/out
          node scripts/collect-news.mjs /tmp/out/news.json /tmp/prev.json

      - name: CORS-Probe (temporär)
        if: github.event_name == 'workflow_dispatch'
        run: >
          node scripts/probe-cors.mjs
          "https://api.onvista.de/api/v1/stocks/ISIN:DE0007164600/snapshot"
          "https://api.onvista.de/api/v1/news/instrument/ISIN:DE0007164600?limit=5"
          "https://api.onvista.de/api/v1/stocks/ISIN:DE0007164600/news?limit=5"
          "https://api.onvista.de/api/v1/news/list?entityValue=DE0007164600&limit=5"
          "https://api.onvista.de/api/v1/news?isin=DE0007164600&limit=5"
          "https://query1.finance.yahoo.com/v1/finance/search?q=SAP&newsCount=5&quotesCount=0"
          "https://feeds.finance.yahoo.com/rss/2.0/headline?s=SAP&region=US&lang=en-US"
          "https://www.finanzen.net/rss/news"
          "https://www.boerse-frankfurt.de/rss/news"
          "https://www.handelsblatt.com/contentexport/feed/finanzen"
          "https://www.n-tv.de/wirtschaft/rss"
          "https://www.spiegel.de/wirtschaft/index.rss"
          "https://www.faz.net/rss/aktuell/finanzen/"
          "https://hn.algolia.com/api/v1/search?query=SAP"
          "https://api.gdeltproject.org/api/v2/doc/doc?query=SAP&mode=artlist&format=json&maxrecords=5"
          "https://www.bing.com/news/search?q=SAP&format=rss"
          "https://news.google.com/rss/search?q=SAP&hl=de&gl=DE&ceid=DE:de"

      - name: In Branch news-data veröffentlichen
        # Läuft auf dem Standard-Branch des Repos (geplante Läufe) – egal, wie dieser heißt
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/out
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "News aktualisiert $(date -u +%Y-%m-%dT%H:%MZ)"
          # Der Daten-Branch enthält immer nur einen Commit (kein wachsender Verlauf).
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" news-data
