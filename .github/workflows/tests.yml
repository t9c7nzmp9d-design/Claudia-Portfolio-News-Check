name: Tests

# Veröffentlicht wird über GitHub Pages („Deploy from a branch“, Branch main, Ordner / (root)).
# Dieser Workflow prüft nur, dass Import und Erkennung funktionieren.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
